name: Build and deploy ASP.Net Core app to Azure Web App - AutoNestWeb20260518164411

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # КОРИГИРАНО: Публикуваме САМО уеб проекта, за да не се презаписват файловете
      - name: dotnet publish
        run: dotnet publish "AutoNest.Web/AutoNest.Web.csproj" -c Release -o ${{env.DOTNET_ROOT}}/myapp -p:ErrorOnDuplicatePublishOutputFiles=false

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E90FE94C145748138C7A8558EADE6F0A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EFF3E5F21DFA460B8290364B89F2BA7A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4FA9E5D29F134C6ABE89F9F949354D2D }}

      # КОРИГИРАНО: Добавена е startup-command, за да знае Linux какво да пусне
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'AutoNestWeb20260518164411'
          slot-name: 'Production'
          package: .
          startup-command: 'dotnet AutoNest.Web.dll'
